<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Blue rounded square background -->
  <rect width="32" height="32" rx="7" fill="#2563EB"/>

  <!-- Signal trace / waveform representing content analysis -->
  <!-- Flat line → spike up → spike down → flat line → small bump -->
  <polyline
    points="4,16 9,16 11,9 13,22 15,16 18,16 20,12 22,20 24,16 28,16"
    stroke="white"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />
</svg>
